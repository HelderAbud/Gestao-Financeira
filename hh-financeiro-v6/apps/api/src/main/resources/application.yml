spring:
  application:
    name: hh-finance-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/hh_finance}
    username: ${SPRING_DATASOURCE_USERNAME:hh}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  # Host 8083 — matriz portfólio (ver Agentes/PORTFOLIO-PORTS.md)
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

hh:
  jwt:
    secret: ${HH_JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${HH_CORS_ORIGINS:http://localhost:5175,http://127.0.0.1:5175}
  ai:
    # Opcional: sem chave, /insights/monthly-analysis usa resumo baseado em regras.
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${HH_OPENAI_MODEL:gpt-4o-mini}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/hh_finance}
    username: ${SPRING_DATASOURCE_USERNAME:hh}
    password: ${SPRING_DATASOURCE_PASSWORD:}
